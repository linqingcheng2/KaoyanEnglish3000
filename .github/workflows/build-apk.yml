name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "releases/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fixes = {
              'chunk_04.txt': (4285, 'i'),
              'chunk_05.txt': (4783, 'H'),
          }
          parts = []
          for p in sorted(Path('project_parts').glob('chunk_*.txt')):
              s = p.read_text()
              if p.name in fixes:
                  idx, expected = fixes[p.name]
                  assert len(s) == 7001, (p.name, len(s))
                  assert s[idx] == expected, (p.name, idx, s[idx])
                  s = s[:idx] + s[idx+1:]
              parts.append(s)
          joined = ''.join(parts)
          assert len(joined) == 52508, len(joined)
          Path('project.tar.gz.b64').write_text(joined)
          PY
          base64 -d project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
          test -f KaoyanEnglish3000_Android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: KaoyanEnglish3000_Android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaoyanEnglish3000-debug-apk
          path: KaoyanEnglish3000_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct-download APK to repository
        shell: bash
        run: |
          mkdir -p releases
          cp KaoyanEnglish3000_Android/app/build/outputs/apk/debug/app-debug.apk releases/KaoyanEnglish3000-phone.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/KaoyanEnglish3000-phone.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish direct-download Android APK"
            git push
          fi
