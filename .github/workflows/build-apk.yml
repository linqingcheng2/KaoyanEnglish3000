name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat project_parts/chunk_*.txt > project.tar.gz.b64
          base64 -d project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
          test -f KaoyanEnglish3000_Android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: KaoyanEnglish3000_Android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaoyanEnglish3000-debug-apk
          path: KaoyanEnglish3000_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
